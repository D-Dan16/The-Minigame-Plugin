name: MinigamePlugin
version: '5.9.2'
main: base.MinigamePlugin
api-version: '1.21'
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:1.9.24
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1
depend:
  - WorldEdit
commands:
  misc:
    description: Miscellaneous commands
    usage: /<command> <name> <...>
  minigame:
    description: Shows the minigame menu
    usage: /<command> <name>
  mg_disco_mayhem:
    description: Starts the Disco Mayhem minigame
    usage: /<command> <state>
  mg_blueprint_bazaar:
    description: Starts the Blueprint Bazaar minigame
    usage: /<command> <state>
  mg_hole_in_the_wall:
    description: Starts the Hole In The Wall minigame
    usage: /<command> <state>
  hitw:
    description: Gives the Hole In The Wall command book
    usage: /<command>
  mg_maze_hunt:
    description: Starts the Maze Hunt minigame
    usage: /<command> <state>
  mg_parkour_dash:
    description: Starts the Parkour Dash minigame
    usage: /<command> <state>
